<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Reactions UI</title>

    <!-- Style CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="container">
    <h1>Facebook Reactions UI</h1>
    <div class="like">
        <i>👍</i>
        <p>Like</p>
    </div>

    <div class="reacts">
        <div class="circle">
            <img src="https://res.cloudinary.com/prvnbist/image/upload/v1492531171/XZOPuv9_eyqlr2.png" alt="">
            <p>Like</p>
        </div>
        <div class="circle">
            <img src="https://res.cloudinary.com/prvnbist/image/upload/v1492531172/uIjLl6R_cmbnqb.png" alt="">
            <p>Love</p>
        </div>
        <div class="circle">
            <img src="https://res.cloudinary.com/prvnbist/image/upload/v1492531177/lsHmtDy_ycqnbp.png" alt="">
            <p>Haha</p>
        </div>
        <div class="circle">
            <img src="https://res.cloudinary.com/prvnbist/image/upload/v1492531177/s475u9d_o8trbg.png" alt="">
            <p>Wow</p>
        </div>
        <div class="circle">
            <img src="https://res.cloudinary.com/prvnbist/image/upload/v1492531172/JJuD9qb_a7gkmu.png" alt="">
            <p>Sad</p>
        </div>
        <div class="circle">
            <img src="https://res.cloudinary.com/prvnbist/image/upload/v1492531178/VDM3zOV_qy9fqj.png" alt="">
            <p>Angry</p>
        </div>
    </div>
</div>

<!-- Script JS -->
<script src="./script.js"></script>

</body>
</html>
